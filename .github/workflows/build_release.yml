name: Release OrbisProxy

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'dev'
        type: choice
        options:
          - stable
          - dev
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Checkout OrbisProxy Core
        uses: actions/checkout@v4
        with:
          repository: OrbisProxy/core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: master
          path: orbisproxy-core

      - name: Checkout OrbisProxy Mod
        uses: actions/checkout@v4
        with:
          repository: OrbisProxy/mod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: master
          path: orbisproxy-mod

      - name: Build OrbisProxy Core
        working-directory: orbisproxy-core
        run: |
          mkdir -p ../dist
          VERSION="${{ github.event.inputs.version }}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -X ricosw.de/proxy/internal/core/buildinfo.Version=$VERSION -X ricosw.de/proxy/internal/core/buildinfo.Commit=$COMMIT -X ricosw.de/proxy/internal/core/buildinfo.BuildDate=$DATE" -o ../dist/orbisproxy-linux ./cmd
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -X ricosw.de/proxy/internal/core/buildinfo.Version=$VERSION -X ricosw.de/proxy/internal/core/buildinfo.Commit=$COMMIT -X ricosw.de/proxy/internal/core/buildinfo.BuildDate=$DATE" -o ../dist/orbisproxy-windows.exe ./cmd

      - name: Build OrbisProxy Mod
        working-directory: orbisproxy-mod
        run: gradle build --no-daemon --stacktrace

      - name: Verify mod build artifacts
        run: |
          echo "Checking for build artifacts..."
          ls -la orbisproxy-mod/build/libs

      - name: Copy mod artifacts
        run: |
          cp orbisproxy-mod/build/libs/*.jar dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Determine release type
        id: release_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - use input
            TYPE="${{ github.event.inputs.release_type }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # v* tags are stable releases
            TYPE="stable"
          fi
          
          if [[ "$TYPE" == "stable" ]]; then
            echo "type=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
          else
            echo "type=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "suffix=-dev" >> $GITHUB_OUTPUT
          fi
          echo "Release type: $TYPE"

      - name: Set release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.version }}"

          if [[ "${{ github.event.inputs.release_type }}" == "dev" ]]; then
            TAG="${TAG}-dev"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"


      - name: Validate Hytale compatibility file
        run: |
          test -f hytale-compat.json || (echo "Missing hytale-compat.json" && exit 1)

      - name: Read Hytale compatibility
        id: hytale_version
        run: |
          PRIMARY=$(jq -r '.primary // "unknown"' hytale-compat.json)

          SUPPORTED=$(jq -r '.supported[]' hytale-compat.json | sed 's/^/- /')

          PRERELEASE=$(jq -r '.pre_release_tested[]? // empty' hytale-compat.json | sed 's/^/- /')

          echo "primary_version=$PRIMARY" >> $GITHUB_OUTPUT

          {
            echo "versions_list<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "prerelease_list<<EOF"
            echo "$PRERELEASE"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OrbisProxy ${{ steps.tag.outputs.tag }}"
          body: |
            ## OrbisProxy Release

            **Release Type:** ${{ steps.release_type.outputs.type == 'stable' && '🟢 Stable' || '🟡 Development' }}
            **Proxy Version:** ``${{ github.event.inputs.version }}``
            **Build:** `#${{ github.run_number }}`
            **Commit:** ``${{ github.sha }}``

            ---

            ### Compatible Hytale Versions:
            ${{ steps.hytale_version.outputs.versions_list }}

            Primary Version: `${{ steps.hytale_version.outputs.primary_version }}`

            ### Tested Hytale Pre-Release Versions:
            ${{ steps.hytale_version.outputs.prerelease_list }}

            ---

            ### Artifacts:

            - orbisproxy-linux
            - orbisproxy-windows.exe
            - orbisproxy-mod-*.jar
            - checksums.txt

            ---

            ### How to Update

              1. Stop the running OrbisProxy instance
              2. Create a backup of your proxy instance and config files!
              3. Download the new release files
              4. Replace the existing OrbisProxy binary with the new one
              5. Update orbisproxy-mod on all backend servers if required
              6. Review config.yml for new or changed options
              7. Start OrbisProxy again

            ---

            ### Quick Start:

            1. Download the OrbisProxy binary for your platform
            2. Start the proxy
            3. Configure config.yml
            4. Restart the proxy
            5. Install the mod on your Hytale server (mods folder)
            6. Start Hytale server
            7. Copy proxySecret to your Hytale server "mods/OrbisProxy_OrbisProxy/config.json" file
            8. Restart Hytale server
            9. Join the proxy server

            See the README for full documentation.
          draft: false
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}